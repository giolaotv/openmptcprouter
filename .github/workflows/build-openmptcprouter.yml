name: openmptcprouter-x86_64

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Branch info
      id: branch_name
      run: |
        echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
        echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "WORKSPACE=${GITHUB_WORKSPACE}" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext \
        git libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 \
        subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp \
        libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf \
        automake libtool autopoint device-tree-compiler python3-pyelftools llvm clang

    - name: Free disk space
      run: |
        df -h
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt-get autoremove -y || true
        sudo apt-get autoclean -y || true
        df -h

    - name: Clone OMR repository
      run: |
        git clone ${{ env.REPO_URL }} omr
        cd omr
        git checkout develop
        git pull

    - name: Remove problematic dnsmasq patch
      run: |
        cd omr/x86_64/6.1/source/package/network/services/dnsmasq/patches
        if [ -f 999-remove-nftset-logs.patch ]; then
          mv 999-remove-nftset-logs.patch 999-remove-nftset-logs.patch.bak
        fi

    - name: Build toolchain
      working-directory: omr
      env:
        OMR_KERNEL: 6.1
      run: |
        OMR_KERNEL="6.1" sh build.sh prepare {tools,toolchain}/install -j$(nproc)

    - name: Build packages
      working-directory: omr
      env:
        OMR_KERNEL: 6.1
      run: |
        make IGNORE_ERRORS=m -C x86_64/6.1/source package/{compile,install,index} -j$(nproc)

    - name: Build image
      working-directory: omr
      env:
        OMR_KERNEL: 6.1
      run: |
        make IGNORE_ERRORS=m -C x86_64/6.1/source target/install -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x86_64_6.1
        path: omr/x86_64/6.1/source/bin
        overwrite: true

    - name: Deploy - Create directory via SSH
      if: steps.branch_name.outputs.SOURCE_BRANCH != ''
      uses: ysurac/ssh-action@master
      with:
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        args: -tt
        command: mkdir -p deploy/${{ steps.branch_name.outputs.SOURCE_BRANCH }}/6.1/x86_64

    - name: Deploy - Upload via rsync
      if: steps.branch_name.outputs.SOURCE_BRANCH != ''
      uses: ysurac/action-rsync@master
      env:
        ARGS: -av --delete-after
        TARGET: deploy/${{ steps.branch_name.outputs.SOURCE_BRANCH }}/6.1/x86_64
        SOURCE: ./omr/x86_64/6.1/source/bin/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
