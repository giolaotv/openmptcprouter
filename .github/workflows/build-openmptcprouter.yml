name: Build OpenMPTCPRouter x86_64

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  KERNEL_VERSION: "6.1"
  OPENWRT_BRANCH: "openwrt-24.10"
  DIST: "openmptcprouter"
  TARGET: "x86_64"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses5-dev libssl-dev bc flex bison \
          libelf-dev git wget curl unzip rsync python3 python3-pip \
          zlib1g-dev gawk gettext sed bash findutils coreutils file \
          gcc-10 g++-10

    - name: Prepare source directories
      run: |
        mkdir -p x86_64/6.1/source/

        if [ -d common ]; then
          echo "Copying common overlays..."
          cp -rf common/* x86_64/6.1/source/
        else
          echo "No common overlays found, skipping..."
        fi

        if [ -d 6.1 ]; then
          echo "Copying 6.1 overlays..."
          cp -rf 6.1/* x86_64/6.1/source/
        else
          echo "No 6.1 overlays found, skipping..."
        fi

        # Apply patch only if file exists
        if [ -f x86_64/6.1/source/include/package-ipkg.mk ]; then
          patch x86_64/6.1/source/include/package-ipkg.mk < patches/package-ipkg.mk.patch || true
        else
          echo "Patch target not found, skipping..."
        fi

    - name: Setup build configuration
      run: |
        echo "OMR_KERNEL=${{ env.KERNEL_VERSION }}" >> $GITHUB_ENV
        echo "OMR_TARGET=${{ env.TARGET }}" >> $GITHUB_ENV
        echo "OMR_DIST=${{ env.DIST }}" >> $GITHUB_ENV
        echo "OMR_OPENWRT=${{ env.OPENWRT_BRANCH }}" >> $GITHUB_ENV
        echo "OMR_ALL_PACKAGES=yes" >> $GITHUB_ENV
        echo "OMR_IMG=yes" >> $GITHUB_ENV

    - name: Make build.sh executable
      run: chmod +x build.sh

    - name: Build OpenMPTCPRouter
      run: |
        ./build.sh \
          --kernel ${{ env.KERNEL_VERSION }} \
          --target ${{ env.TARGET }} \
          --dist ${{ env.DIST }}
      env:
        OMR_KERNEL: ${{ env.KERNEL_VERSION }}
        OMR_TARGET: ${{ env.TARGET }}
        OMR_DIST: ${{ env.DIST }}
        OMR_OPENWRT: ${{ env.OPENWRT_BRANCH }}
        OMR_ALL_PACKAGES: "yes"
        OMR_IMG: "yes"
        OMR_KEEPBIN: "no"
        OMR_LOG: "yes"
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive
      timeout-minutes: 160

    - name: List firmware files
      run: |
        echo "=== Firmware files ==="
        find bin/targets -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) | sort
        find bin/targets -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) -exec ls -lh {} \;

    - name: Generate SHA256 checksums
      run: |
        cd bin/targets/x86/64/
        sha256sum * > sha256sums.txt
        cat sha256sums.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-${{ env.KERNEL_VERSION }}-${{ env.TARGET }}
        path: |
          bin/targets/x86/64/*.img*
          bin/targets/x86/64/*.bin
          bin/targets/x86/64/*.tar.gz
          bin/targets/x86/64/sha256sums.txt
        retention-days: 30
        compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/openmptcprouter-${{ env.KERNEL_VERSION }}-x86_64/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
