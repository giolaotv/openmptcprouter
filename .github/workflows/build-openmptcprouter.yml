name: 🧱 Build OpenMPTCPRouter x86_64 Kernel 6.12 (build.sh)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - build

env:
  TARGET: x86_64
  KERNEL_VERSION: 6.12
  BUILD_DIR: openmptcprouter/x86_64/6.12/source
  REPO_URL: https://github.com/Ysurac/openmptcprouter.git
  REPO_BRANCH: develop

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📦 Checkout this repository
        uses: actions/checkout@v4

      - name: 🧰 Cài đặt môi trường build
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl ccache python3-pip python3-setuptools jq subversion

      - name: 📥 Clone OpenMPTCPRouter source
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          cd $(dirname ${{ env.BUILD_DIR }})
          git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} source

      - name: 🧩 Kiểm tra & cấp quyền thực thi build.sh
        run: |
          cd ${{ env.BUILD_DIR }}
          chmod +x build.sh

      - name: ⚙️ Khởi tạo target build (init)
        run: |
          cd ${{ env.BUILD_DIR }}
          ./build.sh init -t ${{ env.TARGET }}

      - name: 🏗️ Build firmware qua build.sh
        run: |
          cd ${{ env.BUILD_DIR }}
          ./build.sh build -t ${{ env.TARGET }} -k ${{ env.KERNEL_VERSION }}

      - name: 📦 Thu thập firmware output
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find ${{ env.BUILD_DIR }}/bin/targets/ -type f \( -name "*.img.gz" -o -name "*.squashfs" -o -name "*.ext4" -o -name "*.bin" -o -name "*.tar" \) -exec cp {} $GITHUB_WORKSPACE/output/ \;

      - name: ☁️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMPTCPRouter-${{ env.TARGET }}-Kernel${{ env.KERNEL_VERSION }}
          path: output/

      - name: 🚀 Auto Release firmware
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: build-${{ env.TARGET }}-${{ env.KERNEL_VERSION }}-${{ github.run_number }}
          name: "OpenMPTCPRouter Build #${{ github.run_number }} - x86_64 Kernel 6.12"
          body: |
            ✅ Build hoàn tất thông qua build.sh  
            - Target: **${{ env.TARGET }}**  
            - Kernel: **${{ env.KERNEL_VERSION }}**  
            - Bao gồm omr-dscp, luci, firewall4, shadowsocks-rust, v.v.  
            🧱 Tự động build bằng GitHub Actions
          files: output/*
