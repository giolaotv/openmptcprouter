name: openmptcprouter-x86_64

on:
  push:
    branches:
      - develop
    tags:
      - 'v24.10.*'

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set branch/tag info
      id: branch_name
      run: |
        echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
        echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "WORKSPACE=${GITHUB_WORKSPACE}" >> $GITHUB_OUTPUT

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git \
        libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion \
        flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
        libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint \
        device-tree-compiler python3-pyelftools llvm clang

    - name: Free disk space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt-get autoremove -y || true
        sudo apt-get autoclean -y || true
        df -h

    - name: Clone OpenMPTCProuter
      run: |
        git clone $REPO_URL omr
        cd omr
        git checkout develop
        git pull

    - name: Build toolchain
      working-directory: omr
      run: |
        OMR_TARGET=x86_64
        OMR_KERNEL=6.1
        OMR_FEED_SRC=${{ steps.branch_name.outputs.SOURCE_NAME }}
        sh build.sh prepare {tools,toolchain}/install -j$(nproc)

    - name: Remove problematic dnsmasq patch
      working-directory: omr/x86_64/6.1/source
      run: |
        PATCH_DIR="package/network/services/dnsmasq/patches"
        if [ -d "$PATCH_DIR" ]; then
          echo "Removing patch 999-remove-nftset-logs.patch to avoid build failure..."
          rm -f $PATCH_DIR/999-remove-nftset-logs.patch
        else
          echo "Patch directory not found, skipping..."
        fi

    - name: Build packages
      working-directory: omr
      run: |
        OMR_TARGET=x86_64
        OMR_KERNEL=6.1
        make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source package/{compile,install,index} -j$(nproc)

    - name: Build image
      working-directory: omr
      run: |
        OMR_TARGET=x86_64
        OMR_KERNEL=6.1
        make IGNORE_ERRORS=m -C $OMR_TARGET/$OMR_KERNEL/source target/install -j$(nproc)

    - name: Move binaries to workspace
      working-directory: omr
      run: |
        OMR_TARGET=x86_64
        OMR_KERNEL=6.1
        mv $OMR_TARGET/$OMR_KERNEL/source/bin $GITHUB_WORKSPACE/

    - name: Deploy - Create directory via SSH
      if: steps.branch_name.outputs.SOURCE_BRANCH != ''
      uses: ysurac/ssh-action@master
      env:
        SOURCE_BRANCH: ${{ steps.branch_name.outputs.SOURCE_BRANCH }}
      with:
        command: mkdir -p deploy/${{ env.SOURCE_BRANCH }}/6.1/x86_64
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        args: -tt

    - name: Deploy - Upload via rsync
      if: steps.branch_name.outputs.SOURCE_BRANCH != ''
      uses: ysurac/action-rsync@master
      env:
        ARGS: -av --delete-after
        TARGET: deploy/${{ steps.branch_name.outputs.SOURCE_BRANCH }}/6.1/x86_64
        SOURCE: ./bin/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
