name: Build OpenMPTCPRouter x86_64 Multi-Kernel

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      openwrt_branch:
        description: 'OpenWrt branch'
        required: true
        default: 'openwrt-24.10'
        type: string
      dist:
        description: 'Distribution'
        required: true
        default: 'openmptcprouter'
        type: string

env:
  OPENWRT_BRANCH: ${{ github.event.inputs.openwrt_branch || 'openwrt-24.10' }}
  DIST: ${{ github.event.inputs.dist || 'openmptcprouter' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    strategy:
      matrix:
        target: [x86_64]
        kernel_version: [6.12,6.11,6.10,6.6,6.1]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses5-dev libssl-dev bc flex bison libelf-dev \
          git wget curl unzip rsync python3 python3-pip zlib1g-dev gawk gettext \
          sed bash findutils coreutils file gcc-10 g++-10

    - name: Setup build environment
      run: |
        echo "OMR_KERNEL=${{ matrix.kernel_version }}" >> $GITHUB_ENV
        echo "OMR_TARGET=${{ matrix.target }}" >> $GITHUB_ENV
        echo "OMR_DIST=${{ env.DIST }}" >> $GITHUB_ENV
        echo "OMR_OPENWRT=${{ env.OPENWRT_BRANCH }}" >> $GITHUB_ENV
        echo "OMR_ALL_PACKAGES=yes" >> $GITHUB_ENV
        echo "OMR_IMG=yes" >> $GITHUB_ENV
        echo "OMR_KEEPBIN=no" >> $GITHUB_ENV
        echo "OMR_LOG=yes" >> $GITHUB_ENV

    - name: Make build.sh executable
      run: chmod +x build.sh

    - name: Build OpenMPTCPRouter
      run: |
        # Tạm bỏ các dependency chưa có cho kernel mới
        sed -i '/PACKAGE_firewall4/d' tmp/.config-package.in || true
        sed -i '/PACKAGE_bpf-headers/d' tmp/.config-package.in || true
        sed -i '/PACKAGE_uci-firewall/d' tmp/.config-package.in || true

        ./build.sh --kernel ${{ matrix.kernel_version }} --target ${{ matrix.target }} --dist ${{ env.DIST }}
      env:
        OMR_KERNEL: ${{ matrix.kernel_version }}
        OMR_TARGET: ${{ matrix.target }}
        OMR_DIST: ${{ env.DIST }}
        OMR_OPENWRT: ${{ env.OPENWRT_BRANCH }}
        OMR_ALL_PACKAGES: "yes"
        OMR_IMG: "yes"
        OMR_KEEPBIN: "no"
        OMR_LOG: "yes"
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive
      timeout-minutes: 180

    - name: List firmware files
      run: |
        FIRMWARE_PATH=bin/targets/${{ matrix.target }}/${{ matrix.kernel_version }}
        echo "=== Firmware files for $FIRMWARE_PATH ==="
        find $FIRMWARE_PATH -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) | sort
        echo "=== File sizes ==="
        find $FIRMWARE_PATH -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) -exec ls -lh {} \;

    - name: Generate SHA256 checksums
      run: |
        cd bin/targets/${{ matrix.target }}/${{ matrix.kernel_version }}
        sha256sum * > sha256sums.txt
        cat sha256sums.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-${{ matrix.kernel_version }}-${{ matrix.target }}
        path: |
          bin/targets/${{ matrix.target }}/${{ matrix.kernel_version }}/*.img*
          bin/targets/${{ matrix.target }}/${{ matrix.kernel_version }}/*.bin
          bin/targets/${{ matrix.target }}/${{ matrix.kernel_version }}/*.tar.gz
          bin/targets/${{ matrix.target }}/${{ matrix.kernel_version }}/sha256sums.txt
        retention-days: 30
        compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display artifact structure
      run: |
        echo "=== Artifact structure ==="
        find artifacts -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" -o -name "sha256sums.txt" \) | sort

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/openmptcprouter-*/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
