name: Build & Release OpenMPTCPRouter x86_64 Kernel 6.12

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - build
      - 6.12

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      REPO_URL: https://github.com/Ysurac/openmptcprouter.git
      REPO_BRANCH: 6.12
      TARGET: x86_64
      BUILD_DIR: openmptcprouter/x86_64/6.12/source
      TZ: Asia/Ho_Chi_Minh

    steps:
      - name: 🧹 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Cài đặt các gói cần thiết
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl time

      - name: 📥 Clone mã nguồn OpenMPTCPRouter (branch 6.12)
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          cd $(dirname ${{ env.BUILD_DIR }})
          git clone --depth=1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} source
          cd source
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: ⚙️ Cấu hình build cho x86_64 (giữ nguyên omr-dscp)
        run: |
          cd ${{ env.BUILD_DIR }}
          if [ -f openmptcprouter/configs/${{ env.TARGET }}.config ]; then
            cp openmptcprouter/configs/${{ env.TARGET }}.config .config
          else
            make defconfig
          fi
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          make defconfig

      - name: 🧱 Build firmware OpenMPTCPRouter
        run: |
          cd ${{ env.BUILD_DIR }}
          echo "⏳ Bắt đầu biên dịch firmware..."
          make -j$(nproc) V=s || make -j1 V=s
          echo "✅ Build hoàn tất"

      - name: 📦 Thu thập firmware output
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          find ${{ env.BUILD_DIR }}/bin/targets/x86/64/ -type f \( \
            -name "*.img.gz" -o -name "*.ext4*" -o -name "*.squashfs*" -o -name "*.manifest" \
          \) -exec cp {} $GITHUB_WORKSPACE/output/ \;
          ls -lh $GITHUB_WORKSPACE/output

      - name: 📤 Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openmptcprouter-x86_64-kernel6.12
          path: output/*

      - name: 🚀 Tự động tạo bản phát hành (Release)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: omr-x86_64-kernel6.12-${{ github.run_number }}
          name: OpenMPTCPRouter x86_64 Kernel 6.12 Build #${{ github.run_number }}
          body: |
            🔥 **OpenMPTCPRouter x86_64 Kernel 6.12 Build Completed**
            - Bao gồm đầy đủ module: omr-dscp, luci-app-omr-dscp, xtables-addons, v.v.
            - Tự động build từ branch: `${{ env.REPO_BRANCH }}`
            - Ngày build: ${{ env.TZ }}
          files: output/*
