name: Build OpenMPTCProuter x86_64 (auto kernel)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/Ysurac/openmptcprouter.git
  REPO_BRANCH: develop
  TARGET: x86_64
  KERNEL_VERSION: 6.12
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 🧰 Checkout workflow
      uses: actions/checkout@v4

    - name: 🕓 Set timezone
      run: sudo timedatectl set-timezone "$TZ"

    - name: 📦 Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar g++ gawk gettext git \
          java-propose-classpath libncurses5-dev libssl-dev python3 python3-distutils \
          python3-setuptools python3-pip qemu-utils rsync subversion swig time unzip \
          wget zlib1g-dev

    - name: 🔍 Detect available kernel branch
      id: detect-kernel
      run: |
        echo "🔍 Checking available kernel versions..."
        git ls-remote --heads https://github.com/Ysurac/openmptcprouter.git > branches.txt
        if grep -q "openwrt-24.10" branches.txt; then
          echo "KERNEL_VERSION=6.12" >> $GITHUB_ENV
          echo "✅ Found openwrt-24.10 (kernel 6.12)"
        elif grep -q "openwrt-23.05" branches.txt; then
          echo "KERNEL_VERSION=5.15" >> $GITHUB_ENV
          echo "⚠️ Fallback to openwrt-23.05 (kernel 5.15)"
        else
          echo "KERNEL_VERSION=5.4" >> $GITHUB_ENV
          echo "⚠️ Defaulting to kernel 5.4"
        fi

    - name: 🧱 Clone OpenMPTCProuter (develop)
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openmptcprouter
        cd openmptcprouter
        git submodule update --init --recursive
        ls -la

    - name: ⚙️ Initialize OMR build
      run: |
        cd openmptcprouter
        export OMR_KERNEL_VERSION=${KERNEL_VERSION}
        export OMR_TARGET=${TARGET}
        chmod +x build.sh
        echo ">>> Initializing build for ${TARGET} kernel ${KERNEL_VERSION}"
        ./build.sh clean
        ./build.sh init -t ${TARGET} -k ${KERNEL_VERSION}
        ./build.sh update
        ./build.sh prereq
        echo "✅ Init done"

    - name: 🧮 Build firmware
      run: |
        cd openmptcprouter
        export OMR_KERNEL_VERSION=${KERNEL_VERSION}
        export OMR_TARGET=${TARGET}
        echo ">>> Building OpenMPTCProuter full with omr-dscp..."
        ./build.sh build -j$(nproc) full omr-dscp

    - name: 📦 Prepare artifacts
      run: |
        mkdir -p firmware_output
        find openmptcprouter -type f \( -name "*.img.gz" -o -name "*.ext4" -o -name "*.squashfs" \) -exec cp {} firmware_output/ \;
        ls -lh firmware_output

    - name: 📁 Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-${{ env.TARGET }}-kernel-${{ env.KERNEL_VERSION }}
        path: firmware_output/

    - name: 🚀 Create GitHub Release (optional)
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: "build-${{ env.TARGET }}-${{ env.KERNEL_VERSION }}-${{ github.run_number }}"
        name: "OpenMPTCProuter x86_64 Kernel ${{ env.KERNEL_VERSION }}"
        body: |
          ✅ Built automatically from branch: `${{ env.REPO_BRANCH }}`
          🧱 Target: `${{ env.TARGET }}`
          🧮 Kernel: `${{ env.KERNEL_VERSION }}`
          📦 Includes: omr-dscp, full firmware set (.img.gz, .ext4, .squashfs)
        files: firmware_output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
