name: Build OpenMPTCPRouter x86_64 (Kernel 6.6)

on:
  workflow_dispatch:
  push:
    branches:
      - build
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64
      KERNEL_VERSION: 6.6
      REPO_URL: https://github.com/Ysurac/openmptcprouter.git
      REPO_BRANCH: master

    steps:
    - name: 🧹 Checkout
      uses: actions/checkout@v4

    - name: 🧰 Cài đặt gói phụ thuộc build
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          g++-multilib gettext git libncurses-dev libssl-dev python3-distutils \
          rsync unzip zlib1g-dev file wget subversion cmake jq curl

    - name: 📦 Clone OpenMPTCPRouter
      run: |
        mkdir -p openmptcprouter/x86_64/6.6
        cd openmptcprouter/x86_64/6.6
        git clone --depth=1 -b ${REPO_BRANCH} ${REPO_URL} source
        cd source
        echo "✅ Repo cloned successfully:"
        git rev-parse --short HEAD

    - name: ⚙️ Khởi tạo cấu hình build
      run: |
        cd openmptcprouter/x86_64/6.6/source
        chmod +x build.sh
        ./build.sh init -t ${TARGET} -k ${KERNEL_VERSION}
        ./build.sh update
        ./build.sh prereq

    - name: 🏗️ Bắt đầu build firmware
      run: |
        cd openmptcprouter/x86_64/6.6/source
        ./build.sh build -t ${TARGET} -k ${KERNEL_VERSION} -j$(nproc)
        echo "✅ Build complete!"

    - name: 📁 Kiểm tra output firmware
      run: |
        find openmptcprouter/x86_64/6.6/source/bin/targets -type f \( -name "*.img.gz" -o -name "*.ext4" -o -name "*.squashfs" \) || true

    - name: 📤 Upload firmware (artifact)
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-x86_64-kernel6.6
        path: |
          openmptcprouter/x86_64/6.6/source/bin/targets/**

    # Tuỳ chọn: Tự động phát hành release khi build xong
    - name: 🚀 Tạo bản phát hành tự động
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: omr-x86_64-kernel6.6-${{ github.run_number }}
        name: OpenMPTCPRouter x86_64 Kernel 6.6 #${{ github.run_number }}
        files: |
          openmptcprouter/x86_64/6.6/source/bin/targets/**/*.img.gz
          openmptcprouter/x86_64/6.6/source/bin/targets/**/*.ext4
          openmptcprouter/x86_64/6.6/source/bin/targets/**/*.squashfs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
