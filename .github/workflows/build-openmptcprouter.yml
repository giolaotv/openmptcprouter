name: openmptcprouter-x86_64-6.1-24.10.4
on: [push]

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Branch name
      id: branch_name
      run: |
        echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
        echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "WORKSPACE=${GITHUB_WORKSPACE}" >> $GITHUB_OUTPUT

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git \
          libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 \
          subversion flex uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp \
          libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf \
          automake libtool autopoint device-tree-compiler python3-pyelftools llvm clang

    - name: Free disk space
      run: |
        df -h
        sudo swapoff -a >/dev/null 2>&1 || true
        sudo rm -f /swapfile >/dev/null 2>&1 || true
        sudo apt-get autoremove -y >/dev/null 2>&1 || true
        sudo apt-get autoclean -y >/dev/null 2>&1 || true
        df -h

    - name: Clone OpenMPTCPRouter
      run: |
        git clone $REPO_URL omr
        cd omr
        git checkout develop
        git pull

    - name: Remove problematic dnsmasq patch
      working-directory: omr/x86_64/6.1/source
      run: |
        PATCH_DIR="package/network/services/dnsmasq/patches"
        if [ -d "$PATCH_DIR" ]; then
          if [ -f "$PATCH_DIR/999-remove-nftset-logs.patch" ]; then
            mv "$PATCH_DIR/999-remove-nftset-logs.patch" "$PATCH_DIR/999-remove-nftset-logs.patch.bak"
            echo "Patch moved to .bak"
          fi
        else
          echo "Patch directory not found, skipping..."
        fi

    - name: Build toolchain
      working-directory: omr
      env:
        OMR_FEED_URL: https://github.com/ysurac/openmptcprouter-feeds
      run: |
        OMR_KERNEL="6.1" OMR_FEED_SRC="develop" sh build.sh prepare {tools,toolchain}/install -j$(nproc) || \
        OMR_KERNEL="6.1" OMR_FEED_SRC="develop" sh build.sh prepare {tools,toolchain}/install -j1 V=s

    - name: Build packages
      working-directory: omr
      run: |
        make IGNORE_ERRORS=m -C x86_64/6.1/source package/{compile,install,index} -j$(nproc) || \
        make IGNORE_ERRORS=m -C x86_64/6.1/source package/{compile,install,index} -j1 V=s

    - name: Build image
      working-directory: omr
      run: |
        make IGNORE_ERRORS=m -C x86_64/6.1/source target/install -j$(nproc) || \
        make IGNORE_ERRORS=m -C x86_64/6.1/source target/install -j1 V=s

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x86_64
        path: omr/x86_64/6.1/source/bin
        overwrite: true

    - name: Deploy - Create directory via SSH
      uses: ysurac/ssh-action@master
      env:
        SOURCE_BRANCH: ${{ steps.branch_name.outputs.SOURCE_BRANCH }}
        SOURCE_TAG: ${{ steps.branch_name.outputs.SOURCE_TAG }}
      with:
        command: mkdir -p deploy/${{env.SOURCE_BRANCH}}/6.1/x86_64
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        args: -tt

    - name: Move binaries for rsync
      run: |
        mv omr/x86_64/6.1/source/bin ./bin

    - name: Deploy - Upload via rsync
      uses: ysurac/action-rsync@master
      env:
        ARGS: -av --delete-after
        TARGET: deploy/${{ steps.branch_name.outputs.SOURCE_BRANCH }}/6.1/x86_64
        SOURCE: ./bin/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
