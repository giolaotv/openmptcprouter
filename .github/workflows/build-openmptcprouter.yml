name: 🧩 Build OpenMPTCProuter (main) x86_64

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/Ysurac/openmptcprouter
  REPO_BRANCH: main
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 🧰 Checkout workflow
      uses: actions/checkout@v4

    - name: 🕓 Set timezone
      run: sudo timedatectl set-timezone "$TZ"

    - name: 📦 Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar g++ gawk gettext git \
          java-propose-classpath libncurses5-dev libssl-dev python3 python3-distutils \
          python3-setuptools python3-pip qemu-utils rsync subversion swig time unzip \
          wget zlib1g-dev file

    - name: 🧱 Clone OpenMPTCProuter (main branch)
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH
        cd openmptcprouter
        git submodule update --init --recursive
        ls -la

    - name: ⚙️ Initialize and update build system
      working-directory: ./openmptcprouter
      run: |
        chmod +x build.sh
        ./build.sh clean
        ./build.sh init -t x86_64 || true

        # 🩹 Fix feed lỗi (nếu có)
        sed -i '/wmt/d' feeds.conf.default || true
        sed -i '/policycoreutils/d' feeds.conf.default || true

        ./build.sh update
        ./build.sh prereq
        ./build.sh menuconfig noninteractive || true

    - name: 🧮 Build firmware
      working-directory: ./openmptcprouter
      run: |
        echo "🚀 Start building OpenMPTCProuter firmware"
        ./build.sh build -j$(nproc) V=s

    - name: 📁 Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-x86_64-main
        path: openmptcprouter/build/output/
