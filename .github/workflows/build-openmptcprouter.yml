name: Build OpenMPTCProuter x86_64 Advanced

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'
  OMR_TARGET: x86_64
  OMR_KERNEL: 6.1
  OPENWRT_VERSION: v24.10.4

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
    - name: Checkout repository
      run: |
        git clone $REPO_URL omr
        cd omr
        git fetch --all
        git checkout develop
        git pull

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev \
          patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs \
          git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo libglib2.0-dev \
          xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint \
          device-tree-compiler python3-pyelftools llvm clang

    - name: Free disk space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt-get autoremove -y || true
        sudo apt-get autoclean -y || true
        df -h

    - name: Replace dnsmasq with OpenWrt 24.10.4 full version
      run: |
        DNSMASQ_DIR="omr/x86_64/6.1/source/package/network/services/dnsmasq"
        OPENWRT_DL="https://downloads.openwrt.org/releases/24.10.4/packages/x86_64/dnsmasq-full_2.89-1_x86_64.ipk"

        if [ -d "$DNSMASQ_DIR" ]; then
          echo "Removing old dnsmasq source and patches..."
          rm -rf $DNSMASQ_DIR/src $DNSMASQ_DIR/patches
        fi

        echo "Downloading OpenWrt 24.10.4 dnsmasq-full..."
        mkdir -p $DNSMASQ_DIR/src
        cd $DNSMASQ_DIR/src
        wget -q $OPENWRT_DL -O dnsmasq-full.ipk
        ar x dnsmasq-full.ipk
        tar -xvf data.tar.xz
        cd ../../../../../..

    - name: Build toolchain
      working-directory: omr
      run: |
        OMR_KERNEL="${OMR_KERNEL}" sh build.sh prepare tools/toolchain/install -j$(nproc) || \
        OMR_KERNEL="${OMR_KERNEL}" sh build.sh prepare tools/toolchain/install -j1 V=s

    - name: Build packages
      working-directory: omr
      run: |
        make IGNORE_ERRORS=m -C ${OMR_TARGET}/${OMR_KERNEL}/source package/{compile,install,index} -j$(nproc) || \
        make IGNORE_ERRORS=m -C ${OMR_TARGET}/${OMR_KERNEL}/source package/{compile,install,index} -j1 V=s

    - name: Build image
      working-directory: omr
      run: |
        make IGNORE_ERRORS=m -C ${OMR_TARGET}/${OMR_KERNEL}/source target/install -j$(nproc) || \
        make IGNORE_ERRORS=m -C ${OMR_TARGET}/${OMR_KERNEL}/source target/install -j1 V=s

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x86_64-${OMR_KERNEL}
        path: omr/${OMR_TARGET}/${OMR_KERNEL}/source/bin
        overwrite: true

    - name: Deploy via SSH and rsync
      if: ${{ secrets.OMR_DEPLOY_HOST != '' }}
      uses: ysurac/action-rsync@master
      env:
        ARGS: -av --delete-after
        TARGET: deploy/${OMR_KERNEL}/${OMR_TARGET}
        SOURCE: ./omr/${OMR_TARGET}/${OMR_KERNEL}/source/bin/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
