name: OpenMPTCPRouter x86_64 Kernel 6.1 + OpenWrt 24.10.4

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ysurac/openmptcprouter
  OPENWRT_VERSION: v24.10.4
  OMR_TARGET: x86_64
  OMR_KERNEL: 6.1

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev \
            lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
            libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler \
            python3-pyelftools llvm clang

      - name: Create cache directories
        run: |
          mkdir -p $HOME/.cache/omr/toolchain
          mkdir -p $HOME/.cache/omr/feeds
          mkdir -p $HOME/.cache/omr/source

      - name: Cache OpenMPTCPRouter source
        uses: actions/cache@v3
        with:
          path: $HOME/.cache/omr/source
          key: omr-source-${{ hashFiles('**/feeds.conf.default') }}

      - name: Cache OpenMPTCPRouter feeds
        uses: actions/cache@v3
        with:
          path: $HOME/.cache/omr/feeds
          key: omr-feeds-${{ hashFiles('omr/x86_64/6.1/source/feeds.conf.default') }}

      - name: Cache toolchain
        uses: actions/cache@v3
        with:
          path: $HOME/.cache/omr/toolchain
          key: omr-toolchain-${{ env.OMR_KERNEL }}-${{ env.OMR_TARGET }}

      - name: Clone OpenMPTCPRouter source
        run: |
          if [ -d "$HOME/.cache/omr/source/omr" ]; then
            cp -r $HOME/.cache/omr/source/omr ./omr
            cd omr
            git reset --hard
            git clean -fdx
          else
            git clone $REPO_URL omr
            cd omr
          fi
          git checkout develop
          git pull
          cp -r ./omr $HOME/.cache/omr/source/  # update cache

      - name: Replace dnsmasq with OpenWrt 24.10.4 version
        run: |
          cd omr/x86_64/$OMR_KERNEL/source/package/network/services/
          rm -rf dnsmasq
          git clone -b $OPENWRT_VERSION --single-branch https://github.com/openwrt/openwrt.git temp-openwrt
          mv temp-openwrt/package/network/services/dnsmasq ./dnsmasq
          rm -rf temp-openwrt

      - name: Update feeds
        run: |
          cd omr/x86_64/$OMR_KERNEL/source
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build toolchain (with fallback)
        run: |
          cd omr/x86_64/$OMR_KERNEL/source
          sh ../../../../build.sh prepare tools/toolchain/install -j$(nproc) || sh ../../../../build.sh prepare tools/toolchain/install -j1 V=s

      - name: Build packages (multi-threaded with fallback)
        run: |
          cd omr/x86_64/$OMR_KERNEL/source
          make IGNORE_ERRORS=m package/{compile,install,index} -j$(nproc) || make IGNORE_ERRORS=m package/{compile,install,index} -j1 V=s

      - name: Build image
        run: |
          cd omr/x86_64/$OMR_KERNEL/source
          make IGNORE_ERRORS=m target/install -j$(nproc) || make IGNORE_ERRORS=m target/install -j1 V=s

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-bin
          path: omr/x86_64/$OMR_KERNEL/source/bin
          overwrite: true

      - name: Deploy via SSH + rsync
        uses: ysurac/ssh-action@master
        with:
          host: ${{ secrets.OMR_DEPLOY_HOST }}
          user: deploy
          port: ${{ secrets.OMR_DEPLOY_PORT }}
          key: ${{ secrets.PRIVATE_KEY }}
          command: |
            mkdir -p deploy/${OMR_KERNEL}/${OMR_TARGET}
            rsync -av --delete-after ./omr/x86_64/$OMR_KERNEL/source/bin/ deploy/${OMR_KERNEL}/${OMR_TARGET}/
