name: Build OpenMPTCProuter x86_64 (Kernel 6.6 - develop)

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 🧰 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget python3-setuptools python3 python3-pyelftools ccache

      - name: 📦 Clone OpenMPTCProuter source
        run: |
          git clone https://github.com/Ysurac/openmptcprouter.git
          cd openmptcprouter
          echo "✅ Repo cloned"

      - name: 🏗️ Build OpenMPTCProuter (x86_64 / Kernel 6.6 / develop)
        run: |
          cd openmptcprouter
          OMR_TARGET="x86_64" OMR_FEED_SRC="develop" OMR_KERNEL="6.6" ./build.sh

      - name: 📁 Save build output
        if: success()
        run: |
          mkdir -p output
          find openmptcprouter/x86_64 -type f \( -name "*.img.gz" -o -name "*.tar.gz" -o -name "*.bin" \) -exec cp {} output/ \;
          echo "✅ Output copied to ./output"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmptcprouter-x86_64-kernel66
          path: output/
