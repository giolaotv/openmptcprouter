name: Build OpenMPTCPRouter x86_64 Kernel 6.12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    env:
      REPO_URL: https://github.com/Ysurac/openmptcprouter.git
      REPO_BRANCH: 24.10
      TARGET: x86_64
      KERNEL_VERSION: 6.12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex g++ gawk gcc-multilib gettext \
            git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget

      - name: Prepare directories
        run: |
          mkdir -p openmptcprouter/${TARGET}/${KERNEL_VERSION}
          cd openmptcprouter/${TARGET}/${KERNEL_VERSION}
          git clone --depth=1 -b ${REPO_BRANCH} ${REPO_URL} source

      - name: Run build script
        run: |
          cd openmptcprouter/${TARGET}/${KERNEL_VERSION}/source
          chmod +x build.sh
          ./build.sh ${TARGET} ${KERNEL_VERSION}

      - name: Collect firmware outputs
        run: |
          mkdir -p output
          find openmptcprouter/${TARGET}/${KERNEL_VERSION}/source/bin/targets \
            -type f \( -name "*.img*" -o -name "*.gz" -o -name "*.ext4" -o -name "*.squashfs*" -o -name "*.iso" -o -name "*.tar*" \) \
            -exec cp {} output/ \;
          cd output
          sha256sum * > SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmptcprouter-x86_64-${{ env.KERNEL_VERSION }}
          path: output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ env.TARGET }}-${{ env.KERNEL_VERSION }}-${{ github.run_number }}"
          name: "OpenMPTCPRouter ${{ env.TARGET }} Kernel ${{ env.KERNEL_VERSION }}"
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
