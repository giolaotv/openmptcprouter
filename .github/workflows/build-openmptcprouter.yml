name: OpenMPTCPRouter x86_64 Kernel 6.1

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'
  OMR_TARGET: x86_64
  OMR_KERNEL: 6.1
  OPENWRT_VERSION: v24.10.4

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false

    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v3

    - name: Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev libz-dev patch unzip zlib1g-dev \
          lib32gcc-s1 libc6-dev-i386 subversion flex uglifyjs gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
          libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint device-tree-compiler python3-pyelftools llvm clang

    - name: Free disk space
      run: |
        df -h
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt-get autoremove -y || true
        sudo apt-get autoclean -y || true
        sudo rm -rf "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY" /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        df -h

    - name: Clone OpenMPTCPRouter source
      run: |
        git clone $REPO_URL omr
        cd omr
        git checkout develop
        git pull
        pwd

    - name: Remove incompatible dnsmasq patches
      working-directory: omr/x86_64/6.1/source
      run: |
        PATCH_DIR="package/network/services/dnsmasq/patches"
        if [ -d "$PATCH_DIR" ]; then
          echo "Removing incompatible dnsmasq patches..."
          rm -f $PATCH_DIR/999-remove-nftset-logs.patch
          rm -f $PATCH_DIR/200-ubus_dns.patch
        else
          echo "Patch directory not found, skipping..."
        fi

    - name: Update feeds
      working-directory: omr/x86_64/6.1/source
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Build toolchain
      working-directory: omr/x86_64/6.1
      run: |
        OMR_KERNEL="${{ env.OMR_KERNEL }}" sh build.sh prepare tools/toolchain/install -j$(nproc)

    - name: Build packages
      working-directory: omr/x86_64/6.1
      run: |
        make IGNORE_ERRORS=m -C source package/{compile,install,index} -j$(nproc)

    - name: Build image
      working-directory: omr/x86_64/6.1
      run: |
        make IGNORE_ERRORS=m -C source target/install -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: x86_64_build
        path: omr/x86_64/6.1/source/bin
        overwrite: true

    - name: Deploy - Create remote directory via SSH
      if: github.ref == 'refs/heads/develop'
      uses: ysurac/ssh-action@master
      with:
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        args: -tt
        command: |
          mkdir -p deploy/develop/${{ env.OMR_KERNEL }}/${{ env.OMR_TARGET }}

    - name: Deploy - Upload via rsync
      if: github.ref == 'refs/heads/develop'
      uses: ysurac/action-rsync@master
      with:
        ARGS: -av --delete-after
        TARGET: deploy/develop/${{ env.OMR_KERNEL }}/${{ env.OMR_TARGET }}
        SOURCE: ./omr/x86_64/6.1/source/bin/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
