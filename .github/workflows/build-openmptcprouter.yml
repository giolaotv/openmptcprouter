name: Build OpenMPTCPRouter x86_64 (Kernel 6.1, OpenWrt 24.10.4)

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  KERNEL_VERSION: "6.1"
  OPENWRT_BRANCH: "openwrt-24.10"
  DIST: "openmptcprouter"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
    - name: Checkout OpenMPTCPRouter
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses5-dev libssl-dev bc flex bison \
          libelf-dev git wget curl unzip rsync python3 python3-pip \
          zlib1g-dev gawk gettext sed bash findutils coreutils file \
          gcc-10 g++-10

    - name: Prepare OpenWrt 24.10.4 source
      run: |
        mkdir -p x86_64/6.1/source
        cd x86_64/6.1/source

        # Clone main OpenWrt branch
        git clone --depth 1 --branch ${OPENWRT_BRANCH} https://github.com/openwrt/openwrt.git .

        # Clone feeds packages
        git clone --depth 1 --branch ${OPENWRT_BRANCH} https://github.com/openwrt/packages.git feeds/packages
        git clone --depth 1 --branch ${OPENWRT_BRANCH} https://github.com/openwrt/luci.git feeds/luci
        git clone --depth 1 --branch ${OPENWRT_BRANCH} https://github.com/openwrt/routing.git feeds/routing
        git clone --depth 1 --branch ${OPENWRT_BRANCH} https://github.com/openwrt/telephony.git feeds/telephony

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy custom patches
      run: |
        if [ -d "../../../common" ]; then
          cp -rf ../../../common/* .
        fi
        if [ -d "../../../6.1" ]; then
          cp -rf ../../../6.1/* .
        fi

    - name: Set environment variables
      run: |
        echo "OMR_KERNEL=${KERNEL_VERSION}" >> $GITHUB_ENV
        echo "OMR_DIST=${DIST}" >> $GITHUB_ENV
        echo "OMR_OPENWRT=${OPENWRT_BRANCH}" >> $GITHUB_ENV
        echo "OMR_ALL_PACKAGES=yes" >> $GITHUB_ENV
        echo "OMR_IMG=yes" >> $GITHUB_ENV

    - name: Make build.sh executable
      run: chmod +x build.sh

    - name: Build OpenMPTCPRouter
      run: |
        ./build.sh --kernel $OMR_KERNEL --target x86_64 --dist $OMR_DIST
      env:
        OMR_KERNEL: ${{ env.KERNEL_VERSION }}
        OMR_DIST: ${{ env.DIST }}
        OMR_OPENWRT: ${{ env.OPENWRT_BRANCH }}
        OMR_ALL_PACKAGES: "yes"
        OMR_IMG: "yes"
        OMR_KEEPBIN: "no"
        OMR_LOG: "yes"
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive
      timeout-minutes: 180

    - name: List firmware files
      run: |
        echo "=== Firmware files ==="
        find bin/targets -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) | sort

    - name: Generate SHA256 checksums
      run: |
        cd bin/targets/x86/64/
        sha256sum * > sha256sums.txt
        cat sha256sums.txt

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-${{ env.KERNEL_VERSION }}-x86_64
        path: |
          bin/targets/x86/64/*.img*
          bin/targets/x86/64/*.bin
          bin/targets/x86/64/*.tar.gz
          bin/targets/x86/64/sha256sums.txt
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/openmptcprouter-6.1-x86_64/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
