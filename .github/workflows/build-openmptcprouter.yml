name: openmptcprouter-x86_64-6.1
on: [push]

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: Set branch info
      id: branch_name
      run: |
        echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
        echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "WORKSPACE=${GITHUB_WORKSPACE}" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git \
          libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 \
          subversion flex uglifyjs gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
          libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint \
          device-tree-compiler python3-pyelftools llvm clang rsync openssh-client

    - name: Free disk space
      run: |
        df -h
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt-get autoremove -y || true
        sudo apt-get autoclean -y || true
        sudo rm -rf /usr/local/share/boost $AGENT_TOOLSDIRECTORY /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        sudo docker rmi $(docker images -qf "dangling=true") || true
        df -h

    - name: Clone OpenMPTCPRouter
      run: |
        git clone $REPO_URL omr
        cd omr
        git checkout develop
        git pull
      working-directory: ${{ github.workspace }}

    - name: Prepare toolchain
      working-directory: omr
      run: |
        OMR_KERNEL="6.1" OMR_FEED_SRC="develop" sh build.sh prepare {tools,toolchain}/install -j$(nproc)

    - name: Remove problematic dnsmasq patch
      working-directory: omr/x86_64/6.1/source
      run: |
        PATCH_DIR="package/network/services/dnsmasq/patches"
        if [ -d "$PATCH_DIR" ]; then
          if [ -f "$PATCH_DIR/999-remove-nftset-logs.patch" ]; then
            mv "$PATCH_DIR/999-remove-nftset-logs.patch" "$PATCH_DIR/999-remove-nftset-logs.patch.bak"
            echo "Patch moved to .bak"
          fi
        else
          echo "Patch directory not found, skipping..."
        fi

    - name: Build packages
      working-directory: omr/x86_64/6.1/source
      run: |
        make IGNORE_ERRORS=m package/{compile,install,index} -j$(nproc) || make IGNORE_ERRORS=m package/{compile,install,index} -j1 V=s

    - name: Build image
      working-directory: omr/x86_64/6.1/source
      run: |
        make IGNORE_ERRORS=m target/install -j$(nproc) || make IGNORE_ERRORS=m target/install -j1 V=s

    - name: Move binaries for rsync
      run: |
        mv omr/x86_64/6.1/source/bin ${{ github.workspace }}/
    
    - name: Deploy - Create directory via SSH
      if: steps.branch_name.outputs.SOURCE_BRANCH != ''
      uses: ysurac/ssh-action@master
      env:
        SOURCE_BRANCH: ${{ steps.branch_name.outputs.SOURCE_BRANCH }}
      with:
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        command: |
          mkdir -p deploy/${{ env.SOURCE_BRANCH }}/6.1/x86_64

    - name: Deploy - Upload via rsync
      if: steps.branch_name.outputs.SOURCE_BRANCH != ''
      uses: ysurac/action-rsync@master
      env:
        ARGS: -av --delete-after
        TARGET: deploy/${{ steps.branch_name.outputs.SOURCE_BRANCH }}/6.1/x86_64
        SOURCE: ./bin/
        KEY: ${{ secrets.PRIVATE_KEY }}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
