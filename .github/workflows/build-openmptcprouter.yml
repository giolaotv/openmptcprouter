name: Build OpenMPTCProuter x86_64 (Kernel 6.12)

on:
  workflow_dispatch:

env:
  TZ: Asia/Ho_Chi_Minh
  TARGET: x86_64
  KERNEL_VERSION: 6.12
  REPO_URL: https://github.com/Ysurac/openmptcprouter.git
  REPO_BRANCH: openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 🧰 Checkout workflow
      uses: actions/checkout@v4

    - name: 🕓 Set timezone
      run: sudo timedatectl set-timezone "$TZ"

    - name: 📦 Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar g++ gawk gettext git \
          java-propose-classpath libncurses5-dev libssl-dev python3 python3-distutils \
          python3-setuptools python3-pip qemu-utils rsync subversion swig time unzip \
          wget zlib1g-dev

    - name: 📥 Clone OpenMPTCProuter (kernel 6.12)
      run: |
        mkdir -p openmptcprouter/${TARGET}/${KERNEL_VERSION}
        cd openmptcprouter/${TARGET}/${KERNEL_VERSION}
        git clone --depth=1 -b ${REPO_BRANCH} ${REPO_URL} source
        cd source
        chmod +x build.sh
        ls -la

    - name: ⚙️ Initialize OMR build system
      working-directory: openmptcprouter/${{ env.TARGET }}/${{ env.KERNEL_VERSION }}/source
      run: |
        ./build.sh clean
        ./build.sh init -t ${TARGET}
        ./build.sh update
        ./build.sh prereq
        ./build.sh menuconfig noninteractive || true

    - name: 🧮 Build firmware (x86_64, Kernel 6.12)
      working-directory: openmptcprouter/${{ env.TARGET }}/${{ env.KERNEL_VERSION }}/source
      run: |
        ./build.sh build -j$(nproc)
        echo "Build completed ✅"

    - name: 📁 Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OMR-x86_64-Kernel6.12
        path: |
          openmptcprouter/${{ env.TARGET }}/${{ env.KERNEL_VERSION }}/source/build/output/**/*.img.gz
          openmptcprouter/${{ env.TARGET }}/${{ env.KERNEL_VERSION }}/source/build/output/**/*.squashfs*
          openmptcprouter/${{ env.TARGET }}/${{ env.KERNEL_VERSION }}/source/build/output/**/*.ext4*

    - name: 🚀 (Optional) Create GitHub Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "x86_64-kernel6.12-${{ github.run_number }}"
        name: "OMR x86_64 Kernel 6.12 Build #${{ github.run_number }}"
        files: |
          openmptcprouter/${{ env.TARGET }}/${{ env.KERNEL_VERSION }}/source/build/output/**/*.img.gz
          openmptcprouter/${{ env.TARGET }}/${{ env.KERNEL_VERSION }}/source/build/output/**/*.squashfs*
          openmptcprouter/${{ env.TARGET }}/${{ env.KERNEL_VERSION }}/source/build/output/**/*.ext4*
        draft: false
        prerelease: false
