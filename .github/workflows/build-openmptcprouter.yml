name: Build OpenMPTCPRouter x86_64 (Kernel 6.1 + 6.12 + OpenWrt v24.10)

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  OPENWRT_BRANCH: openwrt-24.10
  DIST: openmptcprouter
  TARGET: x86_64

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    strategy:
      matrix:
        kernel: [6.1, 6.12]

    steps:
    - name: Checkout OpenMPTCPRouter
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: develop

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses5-dev \
          libssl-dev \
          bc \
          flex \
          bison \
          libelf-dev \
          git \
          wget \
          curl \
          unzip \
          rsync \
          python3 \
          python3-pip \
          zlib1g-dev \
          gawk \
          gettext \
          sed \
          bash \
          findutils \
          coreutils \
          file \
          gcc-10 \
          g++-10

    - name: Clone OpenWrt Source
      run: |
        mkdir -p openwrt
        git clone --branch $OPENWRT_BRANCH https://github.com/openwrt/openwrt.git openwrt/source
        cd openwrt/source
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Copy patches and kernel support
      run: |
        mkdir -p x86_64/${{ matrix.kernel }}/source
        cp -rf common/* x86_64/${{ matrix.kernel }}/source/
        cp -rf ${{ matrix.kernel }}/* x86_64/${{ matrix.kernel }}/source/ || true

    - name: Make build.sh executable
      run: chmod +x build.sh

    - name: Build OpenMPTCPRouter
      run: |
        ./build.sh \
          --kernel ${{ matrix.kernel }} \
          --target ${{ env.TARGET }} \
          --dist ${{ env.DIST }}
      env:
        OMR_KERNEL: ${{ matrix.kernel }}
        OMR_TARGET: ${{ env.TARGET }}
        OMR_DIST: ${{ env.DIST }}
        OMR_OPENWRT: ${{ env.OPENWRT_BRANCH }}
        OMR_ALL_PACKAGES: "yes"
        OMR_IMG: "yes"
        OMR_KEEPBIN: "no"
        OMR_LOG: "yes"
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive
      timeout-minutes: 160

    - name: List all firmware files
      run: |
        echo "=== Firmware files for ${{ matrix.kernel }} ==="
        find bin/targets -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) | sort
        find bin/targets -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) -exec ls -lh {} \;

    - name: Generate SHA256 checksums
      run: |
        cd bin/targets/x86/64/
        sha256sum * > sha256sums.txt
        cat sha256sums.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-${{ matrix.kernel }}-${{ env.TARGET }}
        path: |
          bin/targets/x86/64/*.img*
          bin/targets/x86/64/*.bin
          bin/targets/x86/64/*.tar.gz
          bin/targets/x86/64/sha256sums.txt
        retention-days: 30
        compression-level: 0

    - name: Prepare release assets
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p release_assets/${{ matrix.kernel }}
        cp -r bin/targets/x86/64/*.img* release_assets/${{ matrix.kernel }}/ || true
        cp -r bin/targets/x86/64/*.bin release_assets/${{ matrix.kernel }}/ || true
        cp -r bin/targets/x86/64/*.tar.gz release_assets/${{ matrix.kernel }}/ || true
        cp bin/targets/x86/64/sha256sums.txt release_assets/${{ matrix.kernel }}/ || true
        ls -la release_assets/${{ matrix.kernel }}/

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display artifact structure
      run: |
        find artifacts -type f -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" | sort
        find artifacts -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" -o -name "sha256sums.txt" \) | wc -l

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/openmptcprouter-*-x86_64/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
