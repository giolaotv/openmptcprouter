name: Build OpenMPTCProuter x86_64 Kernel 6.6

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/Ysurac/openmptcprouter
  REPO_BRANCH: develop
  TARGET: x86_64
  KERNEL_VERSION: 6.6
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 🧰 Checkout repository
      uses: actions/checkout@v4

    - name: 🕓 Set timezone
      run: sudo timedatectl set-timezone "$TZ"

    - name: 📦 Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar g++ gawk gettext git \
          java-propose-classpath libncurses5-dev libssl-dev python3 python3-distutils \
          python3-setuptools python3-pip qemu-utils rsync subversion swig time unzip \
          wget zlib1g-dev

    - name: 🧱 Clone OpenMPTCProuter (develop branch)
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH
        cd openmptcprouter
        git submodule update --init --recursive

    - name: 🧩 Patch build.sh to support kernel 6.6
      working-directory: ./openmptcprouter
      run: |
        # Cho phép build.sh nhận kernel 6.6
        sed -i 's/KERNEL_VERSIONS="\(.*\)"/KERNEL_VERSIONS="\1 6.6"/' build.sh

    - name: ⚙️ Initialize OMR build system
      working-directory: ./openmptcprouter
      run: |
        chmod +x build.sh
        ./build.sh clean
        ./build.sh init -t $TARGET -k $KERNEL_VERSION || true
        ./build.sh update
        ./build.sh prereq
        ./build.sh menuconfig noninteractive || true

    - name: 🧮 Build firmware
      working-directory: ./openmptcprouter
      run: |
        ./build.sh build -j$(nproc)

    - name: 📁 Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-x86_64-6.6
        path: openmptcprouter/build/output/
