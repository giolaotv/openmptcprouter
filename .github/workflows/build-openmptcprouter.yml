name: Build OpenMPTCPRouter x86_64 Kernel 6.12

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/Ysurac/openmptcprouter.git
  REPO_BRANCH: develop
  TARGET: x86_64
  KERNEL_VERSION: 6.12
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up build environment
        run: |
          sudo apt update -y
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

      - name: Clone OpenMPTCPRouter source
        run: |
          mkdir -p openmptcprouter/${TARGET}/${KERNEL_VERSION}
          cd openmptcprouter/${TARGET}/${KERNEL_VERSION}
          git clone --depth=1 -b ${REPO_BRANCH} ${REPO_URL} source

      - name: Start build process
        run: |
          cd openmptcprouter/${TARGET}/${KERNEL_VERSION}/source
          chmod +x build.sh
          ./build.sh init -t ${TARGET} -k ${KERNEL_VERSION}
          ./build.sh config full
          ./build.sh package omr-dscp
          ./build.sh build

      - name: Collect firmware files
        run: |
          mkdir -p firmware_output
          find openmptcprouter/${TARGET}/${KERNEL_VERSION}/source/bin/targets/ \
            -type f \( -name "*.img.gz" -o -name "*.ext4" -o -name "*.squashfs" \) \
            -exec cp {} firmware_output/ \;
          ls -lh firmware_output

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openmptcprouter-x86_64-kernel6.12
          path: firmware_output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "OpenMPTCPRouter x86_64 Kernel 6.12 Build ${{ github.run_number }}"
          body: |
            ✅ OpenMPTCPRouter x86_64 Kernel 6.12 build complete  
            Included omr-dscp module and all full packages.  
            Build timestamp: ${{ github.run_id }}
          files: firmware_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
