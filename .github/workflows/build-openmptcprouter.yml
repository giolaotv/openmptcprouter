name: Build OpenMPTCProuter x86_64

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/Ysurac/openmptcprouter
  REPO_BRANCH: master
  CONFIG_FILE: x86_64.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 🧰 Checkout your repo
      uses: actions/checkout@v4

    - name: 🕓 Set timezone
      run: sudo timedatectl set-timezone "$TZ"

    - name: 📦 Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar g++ gawk gettext git \
          java-propose-classpath libncurses5-dev libssl-dev python3 python3-distutils \
          python3-setuptools python3-pip qemu-utils rsync subversion swig time unzip \
          wget zlib1g-dev

    - name: 🧱 Clone OpenMPTCProuter full source
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openmptcprouter
        cd openmptcprouter
        git submodule update --init --recursive

    - name: ⚙️ Copy custom config & scripts
      run: |
        [ -f $CONFIG_FILE ] && cp $CONFIG_FILE openmptcprouter/.config
        [ -f $DIY_P1_SH ] && chmod +x $DIY_P1_SH && bash $DIY_P1_SH
        [ -f $DIY_P2_SH ] && chmod +x $DIY_P2_SH && bash $DIY_P2_SH

    - name: 📦 Update & install feeds
      working-directory: ./openmptcprouter
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 🧮 Build firmware
      working-directory: ./openmptcprouter
      run: |
        make defconfig
        make download -j$(nproc) || true
        make -j$(nproc) || make -j1 V=s

    - name: 📁 Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-x86_64
        path: openmptcprouter/bin/targets/
