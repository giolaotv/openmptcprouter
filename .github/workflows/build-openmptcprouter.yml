name: Build OpenMPTCPRouter x86_64 (Kernel 6.1 + OpenWrt 24.10.4)

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  KERNEL_VERSION: 6.1
  OPENWRT_BRANCH: openwrt-24.10
  DIST: openmptcprouter

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
    - name: Checkout repository (full history & submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Cache OpenWrt downloads and build_dir
      uses: actions/cache@v4
      with:
        path: |
          dl
          build_dir
          feeds
          .ccache
        key: ${{ runner.os }}-openwrt-${{ env.OPENWRT_BRANCH }}-omr-${{ env.KERNEL_VERSION }}-v1
        restore-keys: |
          ${{ runner.os }}-openwrt-${{ env.OPENWRT_BRANCH }}-omr-

    - name: Install dependencies (with retry)
      run: |
        set -euxo pipefail
        retry() {
          local n=0
          local max=5
          local delay=5
          until [ $n -ge $max ]
          do
            "$@" && break
            n=$((n+1))
            echo "Command failed. Retry $n/$max in $delay s..."
            sleep $delay
            delay=$((delay * 2))
          done
          if [ $n -ge $max ]; then
            echo "Command failed after $max attempts: $*"
            return 1
          fi
        }
        sudo apt-get update
        retry sudo apt-get install -y --no-install-recommends \
          build-essential libncurses5-dev libssl-dev bc flex bison libelf-dev git wget curl unzip rsync \
          python3 python3-pip zlib1g-dev gawk gettext sed bash findutils coreutils file \
          gcc-10 g++-10 ccache
        # Use gcc-10/g++-10 explicitly
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100 || true
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100 || true
        sudo update-alternatives --set gcc /usr/bin/gcc-10 || true
        sudo update-alternatives --set g++ /usr/bin/g++-10 || true
        gcc --version
        g++ --version
        # Configure ccache
        export CCACHE_DIR="$HOME/.ccache"
        mkdir -p "$CCACHE_DIR"
        ccache -M 5G || true
        ccache -s || true

    - name: Pre-build checks (disk, memory)
      run: |
        set -euxo pipefail
        # Disk: require at least 10GB free in workspace
        avail_kb=$(df --output=avail -k "$PWD" | tail -1)
        avail_mb=$((avail_kb/1024))
        echo "Available disk (MB): $avail_mb"
        if [ "$avail_mb" -lt 10240 ]; then
          echo "ERROR: Not enough free disk space (<10GB). Aborting."
          df -h .
          exit 1
        fi
        # RAM: require at least 2GB
        mem_kb=$(grep MemTotal /proc/meminfo | awk '{print $2}')
        mem_mb=$((mem_kb/1024))
        echo "Total RAM (MB): $mem_mb"
        if [ "$mem_mb" -lt 2048 ]; then
          echo "WARNING: Less than 2GB RAM; build may fail or be very slow."
        fi

    - name: Prepare source overlays
      run: |
        set -euxo pipefail
        mkdir -p x86_64/6.1/source
        if [ -d common ]; then
          echo "Copying common overlays..."
          rsync -a --delete common/ x86_64/6.1/source/
        else
          echo "No common overlays found, skipping..."
        fi
        if [ -d 6.1 ]; then
          echo "Copying 6.1 overlays..."
          rsync -a --delete 6.1/ x86_64/6.1/source/
        else
          echo "No 6.1 overlays found, skipping..."
        fi

    - name: Apply patches safely
      run: |
        set -euxo pipefail
        PATCH_FILE="patches/package-ipkg.mk.patch"
        TARGET_FILE="x86_64/6.1/source/include/package-ipkg.mk"
        if [ -f "$PATCH_FILE" ] && [ -f "$TARGET_FILE" ]; then
          echo "Attempting git apply..."
          if git apply --check "$PATCH_FILE"; then
            git apply "$PATCH_FILE"
            echo "Patch applied via git apply."
          else
            echo "git apply check failed; trying fallback patch (non-fatal)."
            ( cd "$(dirname "$TARGET_FILE")" && patch -p0 "$TARGET_FILE" < "../../$PATCH_FILE" ) || true
            echo "Fallback patch attempt finished."
          fi
        else
          echo "Patch or target not found; skipping."
        fi

    - name: Make build.sh executable
      run: |
        chmod +x build.sh
        ls -l build.sh

    - name: Build OpenMPTCPRouter (capture logs)
      run: |
        set -euxo pipefail
        echo "Starting build: logging to build.log"
        mkdir -p build_logs
        ./build.sh --kernel ${KERNEL_VERSION} --target x86_64 --dist ${DIST} 2>&1 | tee build_logs/build.log
        exit ${PIPESTATUS[0]}
      env:
        OMR_KERNEL: 6.1
        OMR_TARGET: x86_64
        OMR_DIST: openmptcprouter
        OMR_OPENWRT: openwrt-24.10
        OMR_ALL_PACKAGES: "yes"
        OMR_IMG: "yes"
        OMR_KEEPBIN: "no"
        OMR_LOG: "yes"
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive

    - name: Archive build log (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_logs/build.log
        retention-days: 30

    - name: List firmware files (non-fatal)
      run: |
        echo "=== Firmware files ==="
        find bin/targets/x86/64/ -type f \( -iname \"*.img*\" -o -iname \"*.bin\" -o -iname \"*.tar.gz\" \) -print | sort || true
        echo "=== File sizes ==="
        find bin/targets/x86/64/ -type f \( -iname \"*.img*\" -o -iname \"*.bin\" -o -iname \"*.tar.gz\" \) -exec ls -lh {} \; || true

    - name: Generate SHA256 checksums (robust)
      run: |
        set -euxo pipefail
        mkdir -p bin/targets/x86/64/
        cd bin/targets/x86/64/
        tmpfile=$(mktemp)
        find . -maxdepth 1 -type f \( -iname \"*.img*\" -o -iname \"*.bin\" -o -iname \"*.tar.gz\" \) -print0 | xargs -0 --no-run-if-empty sha256sum > \"$tmpfile\" || true
        if [ -s \"$tmpfile\" ]; then
          mv \"$tmpfile\" sha256sums.txt
        else
          echo "No firmware files found; creating empty sha256sums.txt"
          : > sha256sums.txt
          rm -f \"$tmpfile\"
        fi
        cat sha256sums.txt

    - name: Upload build artifacts (only existing files)
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-6.1-x86_64
        path: |
          bin/targets/x86/64/*.img*
          bin/targets/x86/64/*.bin
          bin/targets/x86/64/*.tar.gz
          bin/targets/x86/64/sha256sums.txt
        retention-days: 30
        compression-level: 0

    - name: Prepare release assets
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        set -euxo pipefail
        mkdir -p release_assets
        cp -r bin/targets/x86/64/* release_assets/ || true
        echo "=== Release assets ==="
        ls -la release_assets/ || true

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
