name: OpenMPTCPRouter x86_64 Kernel 6.1

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/ysurac/openmptcprouter
  OPENWRT_VERSION: v24.10.4
  OMR_TARGET: x86_64
  OMR_KERNEL: 6.1

jobs:
  build-x86_64:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev \
          libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex \
          uglifyjs git-core gcc-multilib p7zip p7zip-full msmtp libssl-dev texinfo \
          libglib2.0-dev xmlto qemu-utils upx libelf-dev autoconf automake libtool \
          autopoint device-tree-compiler python3-pyelftools llvm clang

    - name: Free disk space
      run: |
        df -h
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt-get autoremove -y || true
        sudo apt-get autoclean -y || true
        sudo rm -rf /usr/local/share/boost || true
        sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo docker rmi $(docker images -qf "dangling=true") || true
        df -h

    - name: Clone OpenMPTCPRouter source
      run: |
        git clone $REPO_URL omr
        cd omr
        git fetch --all
        git checkout develop
        git pull
        pwd

    - name: Prepare toolchain and OpenWrt source
      working-directory: ./omr
      run: |
        OMR_KERNEL=${OMR_KERNEL} sh build.sh prepare tools/toolchain/install -j$(nproc)
        OMR_KERNEL=${OMR_KERNEL} sh build.sh prepare target/install -j$(nproc)

    - name: Replace dnsmasq with OpenWrt 24.10.4 version
      working-directory: ./omr/x86_64/${OMR_KERNEL}/source/package/network/services/
      run: |
        echo "Removing old dnsmasq patches..."
        PATCH_DIR="./dnsmasq/patches"
        if [ -d "$PATCH_DIR" ]; then
          rm -f $PATCH_DIR/*.patch
        fi
        echo "Replacing dnsmasq source with OpenWrt 24.10.4 version..."
        cd ./dnsmasq
        rm -rf src
        git clone --depth 1 https://github.com/openwrt/openwrt.git temp_openwrt
        cp -r temp_openwrt/package/network/services/dnsmasq/src ./src
        rm -rf temp_openwrt

    - name: Build packages
      working-directory: ./omr
      run: |
        make IGNORE_ERRORS=m -C ${OMR_TARGET}/${OMR_KERNEL}/source package/{compile,install,index} -j$(nproc)

    - name: Build image
      working-directory: ./omr
      run: |
        make IGNORE_ERRORS=m -C ${OMR_TARGET}/${OMR_KERNEL}/source target/install -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${OMR_TARGET}_${OMR_KERNEL}_bin
        path: ./omr/${OMR_TARGET}/${OMR_KERNEL}/source/bin
        overwrite: true

    - name: Deploy - Create remote directory
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: ysurac/ssh-action@master
      with:
        host: ${{ secrets.OMR_DEPLOY_HOST }}
        user: deploy
        port: ${{ secrets.OMR_DEPLOY_PORT }}
        key: ${{ secrets.PRIVATE_KEY }}
        command: |
          mkdir -p deploy/${OMR_KERNEL}/${OMR_TARGET}

    - name: Deploy - Upload via rsync
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: ysurac/action-rsync@master
      with:
        ARGS: -av --delete-after
        SOURCE: ./omr/${OMR_TARGET}/${OMR_KERNEL}/source/bin/
        TARGET: deploy/${OMR_KERNEL}/${OMR_TARGET}
        USER: deploy
        HOST: ${{ secrets.OMR_DEPLOY_HOST }}
        PORT: ${{ secrets.OMR_DEPLOY_PORT }}
        KEY: ${{ secrets.PRIVATE_KEY }}
