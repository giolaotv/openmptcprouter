name: Build OpenMPTCProuter x86_64

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/Ysurac/openmptcprouter
  REPO_BRANCH: master
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 🧰 Checkout this repo
      uses: actions/checkout@v4

    - name: 🕓 Set timezone
      run: sudo timedatectl set-timezone "$TZ"

    - name: 📦 Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar g++ gawk gettext git \
          java-propose-classpath libncurses5-dev libssl-dev python3 python3-distutils \
          python3-setuptools python3-pip qemu-utils rsync subversion swig time unzip \
          wget zlib1g-dev

    - name: 🧱 Clone OpenMPTCProuter full source
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH
        mv openmptcprouter openmptcp
        cd openmptcp
        git submodule update --init --recursive
        ls -la

    - name: ⚙️ Prepare OpenMPTCProuter build system
      working-directory: ./openmptcp
      run: |
        ./build init -t x86_64
        ./build update
        ./build menuconfig noninteractive

    - name: 🧮 Build firmware
      working-directory: ./openmptcp
      run: |
        ./build build -j$(nproc)

    - name: 📁 Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-x86_64
        path: openmptcp/build/output/
