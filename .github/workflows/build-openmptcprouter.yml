name: Build OpenMPTCProuter x86_64

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/Ysurac/openmptcprouter
  REPO_BRANCH: master
  TZ: Asia/Ho_Chi_Minh

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 🧰 Checkout this repo
      uses: actions/checkout@v4

    - name: 🕓 Set timezone
      run: sudo timedatectl set-timezone "$TZ"

    - name: 📦 Prepare environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar g++ gawk gettext git \
          java-propose-classpath libncurses5-dev libssl-dev python3 python3-distutils \
          python3-setuptools python3-pip qemu-utils rsync subversion swig time unzip \
          wget zlib1g-dev

    - name: 🧱 Clone OpenMPTCProuter full source
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH
        mv openmptcprouter openmptcp
        cd openmptcp
        git submodule update --init --recursive
        ls -la scripts

    - name: 📦 Update & install feeds
      working-directory: ./openmptcp
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: ⚙️ Default config for x86_64
      working-directory: ./openmptcp
      run: |
        make menuconfig noninteractive || true
        echo "CONFIG_TARGET_x86=y" > .config
        echo "CONFIG_TARGET_x86_64=y" >> .config
        echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
        make defconfig

    - name: 🧮 Build firmware
      working-directory: ./openmptcp
      run: |
        make download -j$(nproc) || true
        make -j$(nproc) || make -j1 V=s

    - name: 📁 Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-x86_64
        path: openmptcp/bin/targets/
