name: openmptcprouter
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

env:
  REPO_URL: 'https://github.com/ysurac/openmptcprouter'
  OMR_TARGET: x86_64
  OMR_KERNEL: 6.1
  OMR_OPENWRT: openwrt-24.10.4

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true

    steps:
    - name: Branch info
      id: branch_name
      run: |
        echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
        echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        echo "WORKSPACE=${GITHUB_WORKSPACE}" >> $GITHUB_OUTPUT

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential asciidoc binutils bzip2 gawk gettext git \
          libncurses5-dev libz-dev patch unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 \
          flex uglifyjs gcc-multilib p7zip-full msmtp libssl-dev texinfo libglib2.0-dev \
          xmlto qemu-utils upx libelf-dev autoconf automake libtool autopoint \
          device-tree-compiler python3-pyelftools llvm clang

    - name: Free disk space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile || true
        sudo apt-get autoremove -y
        sudo apt-get autoclean -y
        sudo rm -rf /usr/local/share/boost /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        sudo docker rmi $(docker images -qf "dangling=true") || true
        df -h

    - name: Clone source code
      run: |
        git clone $REPO_URL omr
        cd omr
        git fetch --all
        git checkout develop
        git pull

    - name: Prepare source overlays
      run: |
        mkdir -p x86_64/6.1/source
        [ -d common ] && cp -rf common/* x86_64/6.1/source/ || echo "No common overlays"
        [ -d 6.1 ] && cp -rf 6.1/* x86_64/6.1/source/ || echo "No 6.1 overlays"

    - name: Apply patches safely
      run: |
        PATCH_FILE="patches/package-ipkg.mk.patch"
        TARGET_FILE="x86_64/6.1/source/include/package-ipkg.mk"
        if [ -f "$PATCH_FILE" ] && [ -f "$TARGET_FILE" ]; then
          patch "$TARGET_FILE" < "$PATCH_FILE" || true
        else
          echo "Patch or target file missing, skipping..."
        fi

    - name: Build toolchain
      run: |
        cd omr
        OMR_KERNEL=6.1 sh build.sh prepare {tools,toolchain}/install -j$(nproc) || \
        OMR_KERNEL=6.1 sh build.sh prepare {tools,toolchain}/install -j1 V=s

    - name: Build packages
      run: |
        cd omr
        make IGNORE_ERRORS=m -C x86_64/6.1/source package/{compile,install,index} -j$(nproc) || \
        make IGNORE_ERRORS=m -C x86_64/6.1/source package/{compile,install,index} -j1 V=s

    - name: Build image
      run: |
        cd omr
        make IGNORE_ERRORS=m -C x86_64/6.1/source target/install -j$(nproc) || \
        make IGNORE_ERRORS=m -C x86_64/6.1/source target/install -j1 V=s

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-x86_64-6.1
        path: omr/x86_64/6.1/source/bin
        overwrite: true
