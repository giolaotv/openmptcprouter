name: Build OpenMPTCPRouter

on:
  push:
    tags:
      - 'v*'
    branches:
      - develop
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - 'x86_64'
          - 'mediatek'
          - 'bcm27xx'
          - 'ipq40xx'
          - 'ipq806x'
      kernel_version:
        description: 'Requested kernel version'
        required: true
        default: '6.12'
        type: string
      dist:
        description: 'Distribution'
        required: true
        default: 'openmptcprouter'
        type: string
      openwrt_branch:
        description: 'OpenWrt branch'
        required: true
        default: 'openwrt-24.10'
        type: string

env:
  OPENWRT_BRANCH: ${{ github.event.inputs.openwrt_branch || 'openwrt-24.10' }}
  DIST: ${{ github.event.inputs.dist || 'openmptcprouter' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev libssl-dev bc flex bison libelf-dev git wget curl unzip rsync python3 python3-pip zlib1g-dev gawk gettext sed bash findutils coreutils file gcc-10 g++-10

    - name: Determine supported kernel
      id: kernel
      run: |
        TARGET="${{ github.event.inputs.target }}"
        REQ_KERNEL="${{ github.event.inputs.kernel_version }}"
        # Map kernel versions by target
        if [[ "$TARGET" == "x86_64" ]]; then
          if [[ "$REQ_KERNEL" == "6.12" ]]; then
            echo "Requested kernel 6.12 not supported on x86_64. Using 6.6 instead."
            KERNEL="6.6"
          else
            KERNEL="$REQ_KERNEL"
          fi
        else
          KERNEL="$REQ_KERNEL"
        fi
        echo "KERNEL_VERSION=$KERNEL" >> $GITHUB_ENV

    - name: Setup build configuration
      run: |
        echo "OMR_KERNEL=${{ env.KERNEL_VERSION }}" >> $GITHUB_ENV
        echo "OMR_TARGET=${{ github.event.inputs.target }}" >> $GITHUB_ENV
        echo "OMR_DIST=${{ env.DIST }}" >> $GITHUB_ENV
        echo "OMR_OPENWRT=${{ env.OPENWRT_BRANCH }}" >> $GITHUB_ENV
        echo "OMR_ALL_PACKAGES=yes" >> $GITHUB_ENV
        echo "OMR_IMG=yes" >> $GITHUB_ENV

    - name: Make build.sh executable
      run: chmod +x build.sh

    - name: Build OpenMPTCPRouter
      run: |
        set -e
        # Ignore patch errors to avoid workflow failure
        ./build.sh \
          --kernel ${{ env.KERNEL_VERSION }} \
          --target ${{ github.event.inputs.target }} \
          --dist ${{ env.DIST }} || true
      env:
        OMR_KERNEL: ${{ env.KERNEL_VERSION }}
        OMR_TARGET: ${{ github.event.inputs.target }}
        OMR_DIST: ${{ env.DIST }}
        OMR_OPENWRT: ${{ env.OPENWRT_BRANCH }}
        OMR_ALL_PACKAGES: "yes"
        OMR_IMG: "yes"
        OMR_KEEPBIN: "no"
        OMR_LOG: "yes"
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive

    - name: List firmware files
      run: |
        echo "=== Firmware files ==="
        find bin/targets -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) | sort

    - name: Generate SHA256 checksums
      run: |
        cd bin/targets/x86/64 || true
        sha256sum * > sha256sums.txt || true
        cat sha256sums.txt || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-${{ env.KERNEL_VERSION }}-${{ github.event.inputs.target }}
        path: |
          bin/targets/x86/64/*.img*
          bin/targets/x86/64/*.bin
          bin/targets/x86/64/*.tar.gz
          bin/targets/x86/64/sha256sums.txt
        retention-days: 30
        compression-level: 0

    - name: Prepare release assets
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p release_assets
        cp -r bin/targets/x86/64/*.img* release_assets/ || true
        cp -r bin/targets/x86/64/*.bin release_assets/ || true
        cp -r bin/targets/x86/64/*.tar.gz release_assets/ || true
        cp bin/targets/x86/64/sha256sums.txt release_assets/ || true
        ls -la release_assets/

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/openmptcprouter-${{ env.KERNEL_VERSION }}-x86_64/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
