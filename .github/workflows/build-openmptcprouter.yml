name: Build OpenMPTCPRouter x86_64 (Kernel 6.1 + OpenWrt 24.10.4)

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

env:
  KERNEL_VERSION: 6.1
  OPENWRT_BRANCH: openwrt-24.10
  DIST: openmptcprouter

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses5-dev libssl-dev bc flex bison libelf-dev git wget curl unzip rsync \
          python3 python3-pip zlib1g-dev gawk gettext sed bash findutils coreutils file gcc-10 g++-10

    - name: Prepare source overlays
      run: |
        mkdir -p x86_64/6.1/source

        if [ -d common ]; then
          echo "Copying common overlays..."
          cp -rf common/* x86_64/6.1/source/
        else
          echo "No common overlays found, skipping..."
        fi

        if [ -d 6.1 ]; then
          echo "Copying 6.1 overlays..."
          cp -rf 6.1/* x86_64/6.1/source/
        else
          echo "No 6.1 overlays found, skipping..."
        fi

    - name: Apply patches safely
      run: |
        PATCH_FILE="patches/package-ipkg.mk.patch"
        TARGET_FILE="x86_64/6.1/source/include/package-ipkg.mk"

        if [ -f "$TARGET_FILE" ] && [ -f "$PATCH_FILE" ]; then
          echo "Applying patch..."
          patch "$TARGET_FILE" < "$PATCH_FILE" || true
        else
          echo "Patch or target file not found, skipping..."
        fi

    - name: Make build.sh executable
      run: chmod +x build.sh

    - name: Build OpenMPTCPRouter
      run: |
        ./build.sh --kernel 6.1 --target x86_64 --dist openmptcprouter
      env:
        OMR_KERNEL: 6.1
        OMR_TARGET: x86_64
        OMR_DIST: openmptcprouter
        OMR_OPENWRT: openwrt-24.10
        OMR_ALL_PACKAGES: "yes"
        OMR_IMG: "yes"
        OMR_KEEPBIN: "no"
        OMR_LOG: "yes"
        FORCE_UNSAFE_CONFIGURE: 1
        DEBIAN_FRONTEND: noninteractive

    - name: List all firmware files
      run: |
        echo "=== Firmware files ==="
        find bin/targets/x86/64/ -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) | sort
        echo "=== File sizes ==="
        find bin/targets/x86/64/ -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" \) -exec ls -lh {} \;

    - name: Generate SHA256 checksums
      run: |
        cd bin/targets/x86/64/
        sha256sum * > sha256sums.txt
        cat sha256sums.txt

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openmptcprouter-6.1-x86_64
        path: |
          bin/targets/x86/64/*.img*
          bin/targets/x86/64/*.bin
          bin/targets/x86/64/*.tar.gz
          bin/targets/x86/64/sha256sums.txt
        retention-days: 30
        compression-level: 0

    - name: Prepare release assets
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p release_assets
        cp -r bin/targets/x86/64/* release_assets/ || true
        echo "=== Release assets prepared ==="
        ls -la release_assets/

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
